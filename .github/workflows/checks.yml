name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/domain.test.mjs tests/expiry.test.mjs tests/voice.test.mjs tests/speech-session.test.mjs tests/voice-ui.test.mjs
